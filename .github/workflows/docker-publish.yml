name: Build and Push AMD OCR Container

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:latest
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v2
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v3
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v4
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v5
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v6
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v7
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v8
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v9
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v10
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v11
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v12
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v13
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v14
            ghcr.io/sahariarhossain524-sketch/amd-ocr-challenge:v15
